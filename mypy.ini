[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
ignore_missing_imports = True
check_untyped_defs = True
disallow_incomplete_defs = True
# Application code only — tests and the alembic migration env are excluded (fixtures/monkeypatching
# and the generated alembic scaffolding are not worth strict typing).
files = app

[mypy-tests.*]
ignore_errors = True
