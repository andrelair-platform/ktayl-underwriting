name: CI

# Tier-A business-logic Python repo (testing.md): the full L0–L4 gate.
#   L0 lint            — ruff + mypy
#   L1 test-unit       — pytest tests/unit --cov ≥70% (SQLite in-memory, no Docker/network)
#   L3 test-contract   — pytest tests/contract (request vs vendored policy-service OpenAPI + own spec)
#   L2 test-integration— pytest tests/integration (full flow vs a REAL Postgres via testcontainers)
# L4 (QA-gate smoke, tests/qa/smoke.py) runs post-deploy against the live service — not in this CI.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY:   harbor.10.0.0.200.nip.io
  IMAGE_NAME: library/ktayl-underwriting
  GHCR_IMAGE: ghcr.io/andrelair-platform/ktayl-underwriting   # prod images (immutable SHA, durable)
  # The Next.js workbench frontend is a SECOND image built from the same commit. Backend + frontend
  # share the SAME tag (the commit SHA) in DIFFERENT repos → Kargo's git-Warehouse model pins both to
  # commitFrom(...)[0:7], so a promotion always moves a consistent backend+frontend pair.
  IMAGE_NAME_FRONTEND: library/ktayl-underwriting-frontend
  GHCR_IMAGE_FRONTEND: ghcr.io/andrelair-platform/ktayl-underwriting-frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (service + test extras)
        run: pip install -e ".[test]"

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (format check)
        run: ruff format --check .

      - name: mypy (types)
        run: mypy .

  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (service + test extras)
        run: pip install -e ".[test]"

      - name: pytest (L1 unit, coverage ≥70%)
        run: pytest tests/unit --cov --cov-report=term-missing --cov-fail-under=70

  test-contract:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (service + test extras)
        run: pip install -e ".[test]"

      - name: pytest (L3 contract — policy-service OpenAPI + own spec)
        run: pytest tests/contract -q

  test-integration:
    needs: lint
    runs-on: ubuntu-latest
    # A GitHub Actions Postgres service container (deterministic; testcontainers' get_connection_url
    # flaked on the runner). The L2 test reads TEST_DATABASE_URL; locally it falls back to testcontainers.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uw
          POSTGRES_PASSWORD: uw
          POSTGRES_DB: underwriting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (service + test extras)
        run: pip install -e ".[test]"

      - name: pytest (L2 integration — full flow vs a real Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://uw:uw@localhost:5432/underwriting_test
        run: pytest tests/integration -q

  # ── Schema docs drift-check: the committed ERD must match the Alembic migrations ──
  # Reverse-engineers the schema by running the Alembic migrations on an EPHEMERAL Postgres (no
  # live-cluster access), then regenerates docs/data-model with the digest-pinned tbls and fails if it
  # drifted. Same source of truth as prod (the migrations). "Docs can't lie." Pattern + the determinism
  # gotchas: developer-platform/schema-erd-autogenerated (reference impl ktayl-core/ktayl-claims).
  # PINNED: postgres:17.4 (tbls embeds database_version) + x86_64 baseline + tbls digest + explicit
  # flags (-t mermaid --sort -j). `public` schema; public.alembic_version excluded via .tbls.yml.
  schema-erd-drift:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: underwriting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: "postgresql+psycopg://postgres:pw@localhost:5432/underwriting"
      TBLS_DSN: "postgres://postgres:pw@localhost:5432/underwriting?sslmode=disable"
      TBLS_IMAGE: ghcr.io/k1low/tbls@sha256:0d90f07aed0c423a6012d542358c10b13fcdf15a1074ceee3d73676c87cc2f79
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the service (so Alembic can import app.* models)
        run: pip install .

      - name: Apply Alembic migrations to the ephemeral DB
        run: alembic upgrade head

      - name: ERD drift-check (regenerate from migrations, fail if committed docs are stale)
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work \
            "$TBLS_IMAGE" doc -t mermaid --sort -j "$TBLS_DSN" docs/data-model --force
          if ! git diff --quiet -- docs/data-model; then
            echo "::error::docs/data-model drifted from the Alembic migrations — regenerate + commit the ERD."
            git --no-pager diff -- docs/data-model | head -80
            exit 1
          fi
          echo "✅ ERD docs are in sync with the migrations"

  frontend:
    # Tier-C UI gate for the Next.js underwriter workbench: L0 (eslint) + L1 (vitest) + build (tsc).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read            # install @andrelair-platform/bff-auth from GitHub Packages
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@andrelair-platform"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: eslint (L0)
        run: npm run lint

      - name: vitest (L1)
        run: npm run test

      - name: next build (typecheck + compile)
        run: npm run build

  build-and-push:
    needs: [lint, test-unit, test-contract, test-integration, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write          # push prod images to ghcr.io
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest:    ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ]; then TAG="${SHA}"; else TAG="${BRANCH}-${SHA}"; fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Hybrid registry: dev images -> Harbor; prod (main) images ALSO -> ghcr.io
          # (durable, immutable SHA — what Kargo's Warehouse will watch).
          HARBOR_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          HARBOR_REF_FE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${TAG}"
          if [ "$BRANCH" = "main" ]; then
            TAGS="${HARBOR_REF}"$'\n'"${{ env.GHCR_IMAGE }}:${TAG}"
            TAGS_FE="${HARBOR_REF_FE}"$'\n'"${{ env.GHCR_IMAGE_FRONTEND }}:${TAG}"
          else
            TAGS="${HARBOR_REF}"
            TAGS_FE="${HARBOR_REF_FE}"
          fi
          { echo "tags<<EOF"; echo "${TAGS}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          { echo "tags_frontend<<EOF"; echo "${TAGS_FE}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.REGISTRY }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /etc/docker/certs.d/${{ env.REGISTRY }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to GHCR (prod images)
        if: github.ref_name == 'main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image (Trivy — CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref:      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format:         table
          exit-code:      '1'
          severity:       CRITICAL
          ignore-unfixed: true
          trivyignores:   .trivyignore

      - name: Build and push frontend
        id: build_frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags_frontend }}
          # gh_token (BuildKit secret) lets the deps stage npm ci install @andrelair-platform/bff-auth
          # from GitHub Packages without baking the token into a layer.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,mode=max,scope=frontend

      - name: Scan frontend image (Trivy — CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref:      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}@${{ steps.build_frontend.outputs.digest }}
          format:         table
          exit-code:      '1'
          severity:       CRITICAL
          ignore-unfixed: true
          trivyignores:   .trivyignore

      - name: Install Cosign
        if: github.ref_name == 'main'
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        if: github.ref_name == 'main'
        uses: anchore/sbom-action/download-syft@v0

      - name: Sign images + attach SBOMs (main only, keyless)
        if: github.ref_name == 'main'
        run: |
          # backend
          cosign sign --yes "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          syft "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}" -o cyclonedx-json=sbom.json
          cosign attach sbom --sbom sbom.json --type cyclonedx "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          # frontend
          cosign sign --yes "${{ env.GHCR_IMAGE_FRONTEND }}@${{ steps.build_frontend.outputs.digest }}"
          syft "${{ env.GHCR_IMAGE_FRONTEND }}@${{ steps.build_frontend.outputs.digest }}" -o cyclonedx-json=sbom-frontend.json
          cosign attach sbom --sbom sbom-frontend.json --type cyclonedx "${{ env.GHCR_IMAGE_FRONTEND }}@${{ steps.build_frontend.outputs.digest }}"
