name: CI

# Tier-A business-logic Python repo (testing.md): the full L0–L4 gate.
#   L0 lint            — ruff + mypy
#   L1 test-unit       — pytest tests/unit --cov ≥70% (SQLite in-memory, no Docker/network)
#   L3 test-contract   — pytest tests/contract (request vs vendored policy-service OpenAPI + own spec)
#   L2 test-integration— pytest tests/integration (full flow vs a REAL Postgres via testcontainers)
# L4 (QA-gate smoke, tests/qa/smoke.py) runs post-deploy against the live service — not in this CI.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY:   harbor.10.0.0.200.nip.io
  IMAGE_NAME: library/ktayl-underwriting
  GHCR_IMAGE: ghcr.io/andrelair-platform/ktayl-underwriting   # prod images (immutable SHA, durable)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (service + test extras)
        run: pip install -e ".[test]"

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (format check)
        run: ruff format --check .

      - name: mypy (types)
        run: mypy .

  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (service + test extras)
        run: pip install -e ".[test]"

      - name: pytest (L1 unit, coverage ≥70%)
        run: pytest tests/unit --cov --cov-report=term-missing --cov-fail-under=70

  test-contract:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (service + test extras)
        run: pip install -e ".[test]"

      - name: pytest (L3 contract — policy-service OpenAPI + own spec)
        run: pytest tests/contract -q

  test-integration:
    needs: lint
    runs-on: ubuntu-latest
    # A GitHub Actions Postgres service container (deterministic; testcontainers' get_connection_url
    # flaked on the runner). The L2 test reads TEST_DATABASE_URL; locally it falls back to testcontainers.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uw
          POSTGRES_PASSWORD: uw
          POSTGRES_DB: underwriting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (service + test extras)
        run: pip install -e ".[test]"

      - name: pytest (L2 integration — full flow vs a real Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://uw:uw@localhost:5432/underwriting_test
        run: pytest tests/integration -q

  build-and-push:
    needs: [lint, test-unit, test-contract, test-integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write          # push prod images to ghcr.io
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest:    ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ]; then TAG="${SHA}"; else TAG="${BRANCH}-${SHA}"; fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Hybrid registry: dev images -> Harbor; prod (main) images ALSO -> ghcr.io
          # (durable, immutable SHA — what Kargo's Warehouse will watch).
          HARBOR_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          if [ "$BRANCH" = "main" ]; then
            TAGS="${HARBOR_REF}"$'\n'"${{ env.GHCR_IMAGE }}:${TAG}"
          else
            TAGS="${HARBOR_REF}"
          fi
          { echo "tags<<EOF"; echo "${TAGS}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.REGISTRY }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /etc/docker/certs.d/${{ env.REGISTRY }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to GHCR (prod images)
        if: github.ref_name == 'main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image (Trivy — CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref:      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format:         table
          exit-code:      '1'
          severity:       CRITICAL
          ignore-unfixed: true

      - name: Install Cosign
        if: github.ref_name == 'main'
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        if: github.ref_name == 'main'
        uses: anchore/sbom-action/download-syft@v0

      - name: Sign image + attach SBOM (main only, keyless)
        if: github.ref_name == 'main'
        run: |
          cosign sign --yes "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          syft "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}" -o cyclonedx-json=sbom.json
          cosign attach sbom --sbom sbom.json --type cyclonedx "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
