[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ktayl-underwriting"
version = "0.1.0"
description = "Underwriting workbench (intake, appetite/eligibility, decision, audit) for the ktayl-solution insurance IS"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AndreLiar" }]
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "uvicorn[standard]==0.34.0",
  "psycopg[binary]==3.2.3",
  "httpx==0.28.1",
  "nats-py==2.9.0",
  "pyjwt[crypto]==2.10.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.15.7",
  "mypy==1.14.1",
  # L3 (contract): validate the request the app sends against the vendored policy-service OpenAPI,
  # and the app's own OpenAPI. jsonschema drives the format-checked CreatePolicyRequest assertion.
  "jsonschema==4.23.0",
  "pyyaml==6.0.2",
  "schemathesis==3.39.5",
  "openapi-spec-validator==0.7.1",
  # L2 (integration): a real Postgres in a throwaway container + real Alembic. psycopg is already a
  # runtime dep; testcontainers spins the DB. Skipped cleanly when Docker is unavailable.
  "testcontainers[postgres]==4.9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# NOTE: no global --cov in addopts. Each layer is its own directory and its own CI job (see
# testing.md); coverage is a UNIT-layer (L1) gate only. The per-command flags decide coverage:
#   L1 unit        : pytest tests/unit --cov --cov-report=term-missing --cov-fail-under=70
#   L3 contract    : pytest tests/contract -q         (no coverage — it validates contracts)
#   L2 integration : pytest tests/integration -q      (no coverage — real Postgres, Docker)
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "migrations/*", "app/__main__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
